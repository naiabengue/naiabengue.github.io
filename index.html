<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naiabengue</title>
<meta name="description" content="Naiabengue — comércio e consultoria de drones para o mercado ibérico.">
<link rel="canonical" href="https://naiabengue.com/">
<meta name="theme-color" content="#14232e">
<style>
  :root { --ink: #14232e; --muted: #5b6b76; --line: #d9a441; --bg: #f6f4ef; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  main { flex: 1; display: flex; align-items: center; padding: 3rem 1.5rem; }
  .card { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: clamp(2.6rem, 8vw, 4.4rem); font-weight: 600; letter-spacing: 0.01em; margin: 0 0 1.25rem; }
  .rule { width: 4.5rem; height: 4px; background: var(--line); margin: 0 0 1.5rem; border: 0; }
  p.lead { font-size: clamp(1.15rem, 2.6vw, 1.4rem); line-height: 1.55; margin: 0 0 2.25rem; }
  .contact { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 1rem; }
  .contact a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 0.25em; text-decoration-thickness: 2px; }
  footer { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 0.85rem; color: var(--muted);
           padding: 1.25rem 1.5rem 1.75rem; text-align: center; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Naiabengue</h1>
    <hr class="rule">
    <p class="lead">Comércio e consultoria de drones para o mercado ibérico.</p>
    <p class="contact">Contacto: <a href="mailto:naiabengue@gmail.com">naiabengue@gmail.com</a></p>
  </div>
</main>
<footer>
  <a href="/fluxoenergetico/news/">Fluxo Energético — notícias de energia</a>
</footer>
</body>
</html>
